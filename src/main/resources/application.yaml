server:
  port: ${PORT:8080}
spring:
  application:
    name: cdg
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:controle_de_gastos}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: ${JPA_SHOW_SQL:true}
    open-in-view: false
  flyway:
    baseline-on-migrate: true
api:
  web:
    base-url: ${CDG_WEB_URL:http://localhost:5173}
  security:
    token:
      secret: ${JWT_SECRET}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite,gemini-3.1-flash-lite}
